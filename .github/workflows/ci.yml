name: CI

# Builds the OCaml engine and runs both test suites on every push and PR.
#
# The pipeline step runs with --skip-real-data: CI runners are frequently
# sandboxed, and a green build must not depend on an unofficial market-data
# endpoint being reachable. The synthetic datasets are seeded, so the pipeline
# is fully reproducible without any network access.

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

# Cancel superseded runs on the same branch; only the newest commit matters.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ocaml:
    name: OCaml engine (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Set up OCaml
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: "5.2"
          dune-cache: true

      - name: Install dependencies
        run: opam install -y dune alcotest qcheck

      - name: Build
        run: opam exec -- dune build --root engine

      - name: Run tests
        run: opam exec -- dune test --root engine --force

      - name: Upload the engine binary
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: statarb-engine
          path: engine/_build/default/bin/main.exe
          retention-days: 7

  python:
    name: Python layer (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      # The integration tests skip themselves when the engine is absent, so
      # this job verifies the Python layer in isolation. The `integration` job
      # below is what exercises the cross-language contract.
      - name: Run tests
        run: python -m pytest python/tests -v

  integration:
    name: Cross-language integration and full pipeline
    runs-on: ubuntu-latest
    needs: [ocaml, python]

    steps:
      - uses: actions/checkout@v4

      - name: Set up OCaml
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: "5.2"
          dune-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: |
          opam install -y dune alcotest qcheck
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Build the engine
        run: opam exec -- dune build --root engine

      # With the engine built, the integration tests no longer skip. These are
      # the tests that would catch a schema drift between the two languages.
      - name: Run the full test suite
        run: python -m pytest python/tests -v

      - name: Run the pipeline
        run: python scripts/run_pipeline.py --skip-real-data

      # Reproducibility is a claim the README makes, so CI checks it: running
      # the pipeline twice must produce byte-identical metrics.
      - name: Verify the pipeline is reproducible
        run: |
          cp reports/coint_medium/metrics.csv /tmp/first_run_metrics.csv
          cp reports/coint_medium/bars.csv /tmp/first_run_bars.csv
          python scripts/run_pipeline.py --skip-real-data
          diff /tmp/first_run_metrics.csv reports/coint_medium/metrics.csv \
            || { echo "::error::metrics.csv is not reproducible across runs"; exit 1; }
          diff /tmp/first_run_bars.csv reports/coint_medium/bars.csv \
            || { echo "::error::bars.csv is not reproducible across runs"; exit 1; }
          echo "Pipeline output is byte-identical across runs."

      # The README claims every number in it is generated, not hand-typed.
      # This is what makes that claim enforceable: it reformats each value from
      # reports/summary.json and asserts the string appears in the README.
      # Runs with --skip-real-data output, so only the offline claims are
      # checked here; the real-data assertions are skipped automatically.
      - name: Verify the README matches the generated artifacts
        run: python scripts/verify_readme.py

      - name: Upload the generated reports
        uses: actions/upload-artifact@v4
        with:
          name: backtest-reports
          path: reports/
          retention-days: 14
